<div class="language-selector">
  <button
    class="language-selector__trigger"
    type="button"
    aria-haspopup="menu"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    <span class="language-selector__code">
      {{ language().toUpperCase() }}
    </span>

    <svg
      class="language-selector__chevron"
      [class.language-selector__chevron--open]="open()"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path d="m7 10 5 5 5-5" />
    </svg>
  </button>

  @if (open()) {
    <div
      class="language-selector__menu"
      role="menu"
    >
      @for (option of options; track option.code) {
        <button
          class="language-selector__option"
          type="button"
          role="menuitem"
          [class.language-selector__option--active]="
            language() === option.code
          "
          (click)="select(option.code)"
        >
          <span class="language-selector__option-code">
            {{ option.shortLabel }}
          </span>

          <span>
            {{ option.label }}
          </span>

          @if (language() === option.code) {
            <span class="language-selector__check">✓</span>
          }
        </button>
      }
    </div>
  }
</div>
